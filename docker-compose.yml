# Laurels: an achievement system for Plex.
#
# 1. Run: docker compose up -d
# 2. On the machine that runs Docker, open http://localhost:8484
#    and do the steps on "Set up Laurels".
#
# Laurels keeps its settings in ./config/settings.json.
# A variable in this file has priority over the Settings page,
# and the Settings page locks that field.
# Guide: docs/install.md

services:
  laurels:
    image: ghcr.io/winterborn/laurels:latest
    build: .                 # used only when the image is not available
    container_name: laurels
    restart: unless-stopped
    ports:
      # Only this machine can open Laurels. A reverse proxy on the same
      # Docker network still reaches it. To open Laurels to other devices
      # on your home network, change this to "8484:8484" after you sign in
      # as the owner.
      - "127.0.0.1:8484:8484"
    environment:
      - PUID=1000            # use the same values as your Plex container
      - PGID=1000
      - TZ=Europe/London     # used for times of day, days and streaks
      # - PLEX_URL=http://plex:32400
      # - PLEX_TOKEN=
      # - POLL_MINUTES=5
      # - TAUTULLI_URL=http://tautulli:8181
      # - TAUTULLI_API_KEY=
      # - DISCORD_WEBHOOK_URL=
      # - PUBLIC_URL=
      # - USER_ALIASES=1:Mum,2:Dad
      # - ALLOWED_USERS=
      # - AUTH=plex
      # - LAN_GUESTS=false
      # - AWARDS_FROM=setup    # or "all": past watches win awards too
    volumes:
      - ./config:/config
    # To use http://plex:32400, connect Laurels to the network of your
    # Plex container. Remove the comment marks below and set the name.
    # networks:
    #   - media

# networks:
#   media:
#     external: true
