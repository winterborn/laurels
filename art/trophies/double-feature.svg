<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<defs>
<linearGradient id="fold-double-feature" x1="0" x2="1" spreadMethod="repeat" gradientTransform="scale(0.14 1)">
